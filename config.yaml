# MPC Node Configuration
# Env vars override everything: LUX_MPC_THRESHOLD, LUX_MPC_ENVIRONMENT, etc.
# Production: all secrets from KMS via --hsm-provider=env or --hsm-provider=aws

mode: consensus
environment: local  # mainnet | testnet | local

# Consensus
mpc_threshold: 2
max_concurrent_keygen: 2

# Storage (SQLite default — no external DB needed)
# Set --api-db to a postgres:// URL to switch to PostgreSQL.
db_path: "."

# Backup
backup_enabled: true
backup_period_seconds: 300
backup_dir: backups

# Key material
event_initiator_pubkey: "c3f3511cd2f849fd61e81ea62a842fd33367ee8fb5b867bb900877c7fb72ce3b"

## NATS (legacy mode only — deprecated, used only with --mode=legacy)
# nats:
#   url: nats://127.0.0.1:4222

## Consul (legacy mode only — deprecated, used only with --mode=legacy)
# consul:
#   address: localhost:8500
