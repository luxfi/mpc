name: Release MPC

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # All builds run on the amd64 self-hosted runner. arm64 cross-compiles
    # via GOARCH; CGO_ENABLED=0 keeps it pure-Go (no cross-compiler needed).
    runs-on: [self-hosted, linux, amd64]
    env:
      GONOSUMCHECK: '*'
      GONOSUMDB: '*'
      GOPRIVATE: 'github.com/luxfi/*'
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Build (cross-compile via GOARCH)
        run: |
          GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w" -o mpcd ./cmd/mpcd/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mpcd-linux-${{ matrix.arch }}
          path: mpcd

  release:
    needs: build
    runs-on: [self-hosted, linux, amd64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
