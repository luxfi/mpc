name: Docker

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Always-online DO ARC amd64 pool (same pool luxfi/node builds on). The
    # DO k8s clusters are linux/amd64, so we build amd64 only — no QEMU (ARC
    # k8s pods can't install privileged binfmt handlers reliably).
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64)
        env:
          # Token for fetching private/uncached first-party Go modules
          # (e.g. luxfi/hsm) — mounted as a BuildKit secret, never in a layer.
          GH_TOKEN: ${{ secrets.UNIVERSE_PAT }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker buildx build \
            --platform linux/amd64 \
            --secret id=gh_token,env=GH_TOKEN \
            --tag ghcr.io/luxfi/mpc:${TAG} \
            --tag ghcr.io/luxfi/mpc:${TAG}-amd64 \
            --push \
            .

  notify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: lux-build-amd64
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_PAT }}
          repository: luxfi/universe
          event-type: image-published
          client-payload: |
            {
              "service": "mpc",
              "image": "ghcr.io/luxfi/mpc:${{ github.ref_name }}",
              "tag": "${{ github.ref_name }}"
            }
