name: Docker

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # No GH-hosted arm runners. arm64 builds via Docker buildx with QEMU on
    # the amd64 self-hosted runner (QEMU is acceptable for Docker builds).
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IMG=ghcr.io/luxfi/mpc:${TAG}-${{ matrix.arch }}
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --tag "$IMG" \
            --push \
            .

  manifest:
    needs: build
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IMG=ghcr.io/luxfi/mpc
          docker manifest create $IMG:$TAG \
            $IMG:${TAG}-amd64 \
            $IMG:${TAG}-arm64
          docker manifest push $IMG:$TAG

  notify:
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_PAT }}
          repository: luxfi/universe
          event-type: image-published
          client-payload: |
            {
              "service": "mpc",
              "image": "ghcr.io/luxfi/mpc:${{ github.ref_name }}",
              "tag": "${{ github.ref_name }}"
            }
