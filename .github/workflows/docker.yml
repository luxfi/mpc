name: Docker

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'hanzo-build-linux-arm64' || 'hanzo-build-linux-amd64' }}
    env:
      GONOSUMCHECK: '*'
      GONOSUMDB: '*'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IMG=ghcr.io/luxfi/mpc:${TAG}-${{ matrix.arch }}
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t $IMG .
          docker push $IMG

  manifest:
    needs: build
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IMG=ghcr.io/luxfi/mpc
          docker manifest create $IMG:$TAG \
            $IMG:${TAG}-amd64 \
            $IMG:${TAG}-arm64
          docker manifest push $IMG:$TAG

  notify:
    needs: manifest
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_PAT }}
          repository: luxfi/universe
          event-type: image-published
          client-payload: |
            {
              "service": "mpc",
              "image": "ghcr.io/luxfi/mpc:${{ github.ref_name }}",
              "tag": "${{ github.ref_name }}"
            }
