# Minimal local development stack.
# SQLite is the default storage — no external DB required to start.
# For production, uncomment postgres and valkey below.

services:
  api:
    image: ghcr.io/luxfi/mpc-api:latest
    command: >
      start --mode consensus
      --api-listen :8081
      --data /data/mpc
      --jwt-secret ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - mpc-data:/data/mpc
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    image: ghcr.io/luxfi/mpc-dashboard:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081/v1
    depends_on:
      api:
        condition: service_healthy

