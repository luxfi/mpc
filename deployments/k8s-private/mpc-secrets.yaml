# Private-mode secrets template.
#
# Operators do NOT commit this file with real values. The fund's KMS
# operator populates the keys via External Secrets Operator, Vault
# Agent injector, or a kubectl-driven KMS pipeline. Every key MUST be
# rotated at the fund's policy interval.
apiVersion: v1
kind: Secret
metadata:
  name: mpc-secrets
  namespace: fund-mpc
type: Opaque
stringData:
  # Cloud HSM provider type: aws | gcp | azure | pkcs11
  hsm-provider: "REPLACE_WITH_PROVIDER"
  # ARN/resource-name of the master key the HSM provider uses to wrap
  # the ZapDB encryption password.
  hsm-key-id: "REPLACE_WITH_HSM_KEY_ID"
  # Optional cosigner provider (defaults to local). Recommended:
  # aws | gcp | azure for hardware-rooted intent co-signing.
  hsm-signer: "local"
  # Dashboard JWT — rotated weekly via the fund's KMS pipeline.
  jwt-secret: "REPLACE_WITH_32_BYTE_HEX"
  # Internal API bearer for cross-pod traffic on port 9800.
  internal-api-key: "REPLACE_WITH_32_BYTE_HEX"
